  <!-- vô lăng -->
  <circle cx="250" cy="318" r="62" fill="none" stroke="#0f172a" stroke-width="16"/>
  <circle cx="250" cy="318" r="12" fill="#0f172a"/>
  <line x1="190" y1="318" x2="310" y2="318" stroke="#0f172a" stroke-width="10"/>
  <!-- biển cấm -->
  <circle cx="520" cy="215" r="70" fill="#fff" stroke="#dc2626" stroke-width="14"/>
  <rect x="500" y="170" width="40" height="80" rx="7" fill="#111827"/>
  <rect x="506" y="180" width="28" height="56" rx="3" fill="#60a5fa"/>
  <line x1="470" y1="165" x2="570" y2="265" stroke="#dc2626" stroke-width="14"/>
