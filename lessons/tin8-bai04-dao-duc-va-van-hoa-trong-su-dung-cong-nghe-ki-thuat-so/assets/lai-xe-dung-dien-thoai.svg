  <path d="M292 275 Q330 250 300 215" fill="none" stroke="#fcd34d" stroke-width="22" stroke-linecap="round"/>
  <rect x="286" y="180" width="26" height="46" rx="5" fill="#111827" stroke="#e5e7eb" stroke-width="3"/>
